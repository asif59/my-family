<main class="pt-20">

    <!-- family-section-start -->

        <div class="grid grid-cols-2 items-center gap-2 mt-10">
            <img src="images/family/524.jpg" alt="Family Member 1" class="w-36 h-36 rounded-tr-4xl rounded-bl-4xl clickable-image" onclick="openImage(this)">
            <img src="images/family/57.jpg" alt="Family Member 2" class="w-36 h-36 rounded-tl-4xl rounded-br-4xl clickable-image" onclick="openImage(this)">
            <img src="images/family/76.jpg" alt="Family Member 3" class="w-36 h-36 rounded-tl-4xl rounded-br-4xl clickable-image" onclick="openImage(this)">
            <img src="images/family/524.jpg" alt="Family Member 4" class="w-36 h-36 rounded-tr-4xl rounded-bl-4xl clickable-image" onclick="openImage(this)">
            <img src="images/family/524.jpg" alt="Family Member 1" class="w-36 h-36 rounded-tr-4xl rounded-bl-4xl clickable-image" onclick="openImage(this)">
            <img src="images/family/57.jpg" alt="Family Member 2" class="w-36 h-36 rounded-tl-4xl rounded-br-4xl clickable-image" onclick="openImage(this)">

            <img src="images/family/524.jpg" alt="Family Member 4" class="w-36 h-36 rounded-tr-4xl rounded-bl-4xl clickable-image" onclick="openImage(this)">
        </div>

        <!-- Full Image Modal -->
        <div id="imageModal" class="image-modal">
            <span class="close-image" onclick="closeImage()">&times;</span>
            <img id="fullImage" src="" alt="Full Image">
        </div>
    </section>

<!-- hamburger-menu-js-start -->
<script>
    function showSidebar(){
        const sidebar = document.querySelector('.sidebar')
            sidebar.style.display = 'flex'
            }
    function hideSidebar(){
        const sidebar = document.querySelector('.sidebar')
            sidebar.style.display = 'none'
            }            
</script>
<!-- hamburger-menu-js-end -->

<!-- slider-js-start -->
<script>
    let currentSlide = 0;
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");
    const slidesContainer = document.querySelector(".slides");

        function showSlide(index) {
            if (index < 0) index = slides.length - 1;
            if (index >= slides.length) index = 0;
            currentSlide = index;
            slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach((dot) => dot.classList.remove("active"));
            dots[currentSlide].classList.add("active");
        }

    setInterval(() => {
    showSlide(currentSlide + 1);
        }, 4000);

    dots.forEach((dot, idx) => {
        dot.addEventListener("click", () => showSlide(idx));
        });
</script>
<!-- slider-js-end -->  

<script>
        function openImage(image) {
            const modal = document.getElementById("imageModal");
            const fullImage = document.getElementById("fullImage");
            modal.style.display = "flex";
            fullImage.src = image.src;
        }
        function closeImage() {
            document.getElementById("imageModal").style.display = "none";
        }
</script>
</body>
